<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#081d20"/><stop offset="1" stop-color="#10494b"/></linearGradient><style>.h{font:700 34px Arial,sans-serif;fill:#fff}.s{font:700 20px Arial,sans-serif;fill:#fff}.t{font:400 16px Arial,sans-serif;fill:#d7e7e8}.b{font:700 15px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="440" rx="26" fill="url(#g)"/>
  <text x="55" y="60" class="h">Using Any Video Downloader</text>
  <g transform="translate(55 100)"><rect width="330" height="270" rx="18" fill="#fff"/><rect x="20" y="20" width="290" height="150" rx="12" fill="#1d2f4f"/><circle cx="280" cy="142" r="25" fill="#0aa58f"/><text x="270" y="151" class="b" font-size="24">↓</text><text x="20" y="210" class="s" fill="#183b3f">1. Open a video page</text><text x="20" y="240" class="t" fill="#426065">The floating download launcher appears.</text></g>
  <g transform="translate(435 100)"><rect width="330" height="270" rx="18" fill="#fff"/><rect x="35" y="20" width="260" height="150" rx="12" fill="#102b2e"/><rect x="55" y="48" width="110" height="38" rx="8" fill="#0aa58f"/><text x="72" y="72" class="b">Download All</text><rect x="175" y="48" width="82" height="38" rx="8" fill="#3c5559"/><text x="194" y="72" class="b">Scan</text><text x="55" y="120" class="t">Detected videos appear here</text><text x="20" y="210" class="s" fill="#183b3f">2. Scan when needed</text><text x="20" y="240" class="t" fill="#426065">Useful for lazy-loaded/custom players.</text></g>
  <g transform="translate(815 100)"><rect width="330" height="270" rx="18" fill="#fff"/><rect x="30" y="25" width="270" height="135" rx="12" fill="#f1f6f6" stroke="#c9d9da"/><text x="50" y="58" class="t" fill="#183b3f">Lesson / Video title</text><rect x="50" y="82" width="112" height="36" rx="8" fill="#0aa58f"/><text x="73" y="105" class="b">Download</text><rect x="175" y="82" width="100" height="36" rx="8" fill="#0aa58f"/><text x="191" y="105" class="b">All Videos</text><text x="20" y="210" class="s" fill="#183b3f">3. Download</text><text x="20" y="240" class="t" fill="#426065">Choose one video or download all detected media.</text></g>
</svg>