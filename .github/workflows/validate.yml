name: Validate Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check header-rules.js
          node --check title-helper.js
          node --check spa-navigation-hook.js
          node --check content.js
          node --check hls-page-capture.js
          node --check service-worker.js
          node --check offscreen-v2.js
          node --check youtube-listener.js
          node --check youtube-probe.js
          node --check tests/service-worker-smoke.mjs
          node --check tests/offscreen-v2-smoke.mjs
          node --check tests/behavior-regressions.mjs
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
      - name: Basic manifest assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = require('./manifest.json');
          if (m.manifest_version !== 3) throw new Error('Manifest must be v3');
          if (m.version !== '2.9.1') throw new Error('Unexpected release version');
          if (!m.permissions.includes('declarativeNetRequestWithHostAccess')) throw new Error('Missing signed-CDN request-context permission');
          if (!m.permissions.includes('storage')) throw new Error('Missing MV3 session-persistence permission');
          if (m.background?.service_worker !== 'background.js') throw new Error('Background bootstrap is not wired');
          const mainScripts = m.content_scripts?.[0]?.js || [];
          for (const f of ['title-helper.js','content.js','hls-page-capture.js']) if (!mainScripts.includes(f)) throw new Error(`Main page script not wired: ${f}`);
          const hlsCapture = fs.readFileSync('hls-page-capture.js','utf8');
          if (!hlsCapture.includes('isYouTube') || !hlsCapture.includes('captureDecodedPageVideo')) throw new Error('YouTube decoded-page capture fallback is missing');
          const html = fs.readFileSync('offscreen.html','utf8');
          if (!html.includes('offscreen-v2.js')) throw new Error('Offscreen conversion pipeline is incomplete');
          if (!m.content_scripts.some(x => x.world === 'MAIN' && x.js?.includes('spa-navigation-hook.js'))) throw new Error('Main-world SPA navigation hook is not wired');
          for (const f of ['background.js','header-rules.js','title-helper.js','spa-navigation-hook.js','content.js','hls-page-capture.js','offscreen-v2.js']) if (!fs.existsSync(f)) throw new Error(`Missing ${f}`);
          if (fs.existsSync('ts-to-playable.js')) throw new Error('Obsolete TS download interception layer should not remain in package');
          if (fs.existsSync('offscreen.js')) throw new Error('Obsolete offscreen.js should not remain in package');
          if (fs.existsSync('format-guard.js')) throw new Error('Obsolete format-guard.js should not remain in package');
          console.log(`Any Video Downloader ${m.version} validated`);
          NODE
      - name: Run service-worker smoke tests
        run: node tests/service-worker-smoke.mjs
      - name: Run partial-range recovery smoke test
        run: node tests/offscreen-v2-smoke.mjs
      - name: Run behavior regression tests
        run: node tests/behavior-regressions.mjs
